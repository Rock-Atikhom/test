execution:
  # Mode: 'local' (uses PyTorch on CPU/GPU) or 'jetson' (uses TensorRT engine and hardware GStreamer)
  mode: "local"

stream:
  # Source: 0 (webcam), path to video file, or RTSP stream URL
  # Mock CCTV Streams available:
  # - rtsp://172.16.30.111:8554/cctv0
  # - rtsp://172.16.30.111:8554/cctv1
  # - rtsp://172.16.30.111:8554/cctv2
  # - rtsp://172.16.30.111:8554/cctv3
  # - rtsp://172.16.30.111:8554/cctv4
  source: "rtsp://172.16.30.111:8554/cctv1"
  width: 1280
  height: 720
  # Target FPS for the capture thread
  fps: 30
  output_path: "output.mp4"
  show_gui: true

model:
  # Model Type: 'yolo' or 'rfdetr'
  type: "yolo"
  # Path to PyTorch model (e.g., 'yolo26n.pt' or 'rfdetr-nano') or compiled TensorRT engine
  model_path: "yolo26n.pt"
  tracker_config: "bytetrack.yaml"
  imgsz: 320             # Image resolution for model (320 is recommended for Jetson Nano, 640 for local)
  conf: 0.35
  # Class filter IDs: 2 (car), 3 (motorcycle), 5 (bus), 7 (truck)
  classes: [2, 3, 5, 7]

preprocessing:
  # Enable Lab CLAHE preprocessing for bad lighting conditions
  use_lab_clahe: false

counting:
  enabled: true
  # [x1, y1, x2, y2] of the virtual counting line (defaults to midpoint of screen height)
  line_coords: [0, 360, 1280, 360]

roi:
  enabled: true
  # Polygon coordinates defining the Region of Interest: [[x1, y1], [x2, y2], [x3, y3], ...]
  # Example trapezoid ROI for 1280x720: [[100, 700], [500, 350], [800, 350], [1200, 700]]
  polygon: [[100, 700], [500, 350], [800, 350], [1200, 700]]
